<script>
const $=id=>document.getElementById(id);let state={files:[],busy:false},selected=new Set(),finger='',uploading=false,lastStatus='';const words={tr:{files:'Dosyalar',add:'Dosya ekle',remove:'Seçileni kaldır',clear:'Listeyi temizle',original:'Listeden kaldırmak orijinal dosyaları silmez.',settings:'Seçili dosyanın ayarları',mode:'Ne yapmak istiyorsun?',convert:'Biçimini dönüştür',extras:'Farklı işlemler',action:'Yapılacak işlem',target:'Neye dönüştürülsün?',quality:'Video kalitesi',originalQuality:'Kaynağı koru',high:'Yüksek',balanced:'Dengeli',small:'Küçük dosya',onlytext:'Yalnızca metni al',ocrlang:'Belgedeki yazının dili',start:'Başlangıç zamanı / sesin ekleneceği an',end:'Bitiş zamanı · boşsa sonuna kadar',part:'Parça süresi (saniye)',pages:'Sayfa grupları',pagehint:'Örnek: 1-3;4-6. Boşsa her sayfa ayrı dosya.',audio:'Eklenecek ses · önce dosya listesine ekle',audiostart:'Ses dosyasında başlangıç',audioend:'Ses dosyasında bitiş · boşsa sonuna kadar',speechformat:'Çıktı biçimi (SRT zamanları kaynak videoya göredir)',speechlang:'Konuşmanın dili',run:'İşlemi başlat',cancel:'Durdur',details:'İşlem ayrıntıları ve gerekli araçlar',downloadhint:'İşlem bitince çıktıyı indir. Sunucuyu kapatmadan dosyalarını kaydet. İndirme yerini tarayıcın belirler.',timehint:'15 = 15 saniye, 1:30 = 1 dakika 30 saniye. İşleme göre seçilen aralık kullanılır.',ready:'Hazır. Dosya ekleyebilirsin.',running:'İşlem sürüyor…',done:'Dönüştürme işlemi bitti.',cancelled:'İşlem durduruldu.',error:'İşlem yapılamadı.',empty:'Liste boş.',local:'Çevrimdışı · yalnız bu bilgisayarda çalışır',batch:'Dönüştürmede seçili dosyalar sırayla işlenir. Birleştirme liste sırasını kullanır. Diğer işlemler ilk seçili dosyada çalışır.',upload:'Dosya ekleniyor…',missing:'Eksik araçlar: ',rotate:'Döndürme açısı: 90 / 180 / 270',factor:'Katsayı · hız: 0.5–2, ses: 1=aynı'},ku:{files:'Dosye',add:'Dosye lê zêde bike',remove:'Hilbijartî rake',clear:'Lîsteyê paqij bike',original:'Rakirin ji lîsteyê dosyeyên resen jê nake.',set const names={subtitle_text:['SRT → TXT (çeviri için)','SRT → TXT (ji bo wergerê)'],subtitle_restore:['Çevrilmiş TXT → SRT','TXT ya wergerandî → SRT'],convert:['Biçimini dönüştür','Formatê biguherîne'],trim:['Video/ses kes','Vîdyo/deng bibire'],remove_range:['Seçili bölümü sil','Beşa hilbijartî rake'],split:['Parçala','Parçe bike'],merge:['Birleştir','Yek bike'],mute_range:['Bir bölümün sesini kapat','Dengê beşekê bigire'],mute:['Videoyu sessiz yap','Vîdyoyê bêdeng bike'],extract_audio:['Videodan sesi çıkar','Deng ji vîdyoyê derxe'],add_audio:['Ses ekle','Deng lê zêde bike'],replace_audio:['Videonun sesini değiştir','Dengê vîdyoyê biguherîne'],frame:['Videodan fotoğraf al','Wêne ji vîdyoyê derxe'],gif:['GIF oluştur','GIF çêke'],rotate:['Videoyu döndür','Vîdyoyê bizivirîne'],speed:['Hızı değiştir','Lezê biguherîne'],volume:['Ses düzeyini değiştir','Asta deng biguherîne'],fade_in:['Sesi yavaşça yükselt','Deng hêdî bilind bike'],fade_out:['Sesi yavaşça azalt','Deng hêdî kêm bike'],transcribe:['Konuşmayı yazıya dök','Axaftinê binivîse']};function t(k){return words[$('lang').value][k]||k}async function api(path,data,body){let r=await fetch(path,{method:data===undefined?'GET':'POST',headers:body?{'X-Filename':encodeURIComponent(data.webkitRelativePath||data.name)}:data===undefined?{}:{'Content-Type':'application/json'},body:body|| (data===undefined?undefined:JSON.stringify(data))});let d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}function opts(id,values,label){let old=$(id).value;$(id).replaceChildren(...values.map(v=>{let o=document.createElement('option');o.value=v;o.textContent=label?label(v):v.toUpperCase();return o}));if(values.includes(old))$(id).value=old}function chosen(){return state.files.filter(f=>selected.has(f.id))}function controls(){let f=chosen()[0],extra=$('mode').value==='extras',act=$('action').value,doc=f&&!['audio','video'].includes(f.kind);for(let [id,on] of Object.entries({actionbox:extra,targetbox:!extra,qualitybox:!extra&&f?.kind==='video',docbox:!extra&&doc,times:extra&&!doc&&!['merge','mute'].includes(act),partbox:extra&&act==='split'&&!doc,pagesbox:extra&&act==='split'&&doc,factorbox:extra&&['rotate','speed','volume'].includes(act),audiobox:extra&&['add_audio','replace_audio','subtitle_restore'].includes(act),speechformatbox:extra&&act==='transcribe',speechbox:extra&&act==='transcribe'}))$(id).hidden=!on;$('factorlabel').textContent=t(act==='rotate'?'rotate':'factor');let restore=act==='subtitle_restore';$('audio').previousElementSibling.textContent=restore?($('lang').value==='tr'?'Orijinal SRT dosyası':'SRT ya orîjînal'):t('audio');for(let id of ['audiostart','audioend'])$(id).parentElement.hidden=restore;$('hint').textContent=['subtitle_text','subtitle_restore'].includes(act)?($('lang').value==='tr'?'Çeviri ayrı programda yapılır. Her altyazıyı tek TXT satırında tut. TXT → SRT için orijinal SRT dosyasını listene ekleyip seç; zamanlar aynen korunur.':'Di bernameyeke din de wergerîne. Her binivîs rêzek TXT e. Ji bo TXT → SRT pela SRT ya orîjînal li lîsteyê zêde bike û hilbijêre.'):t('batch');$('run').disabled=state.busy||uploading||!f||(!extra&&!$('target').value);$('cancel').disabled=!state.busy}
function settings(){let files=chosen(),f=files[0];opts('target',[...new Set(files.flatMap(z=>z.targets))]);opts('action',[...new Set(files.flatMap(z=>z.actions))],v=>names[v]?.[$('lang').value==='ku'?1:0]||v);opts('audio',state.files.filter(z=>z.kind==='audio'||z.format==='srt').map(z=>z.id),id=>state.files.find(z=>z.id===id).name);controls()}
function render(){let box=$('files');box.replaceChildren();if(!state.files.length)box.textContent=t('empty');for(let f of state.files){let row=document.createElement('label');row.className='row';let c=document.createElement('input');c.type='checkbox';c.checked=selected.has(f.id);c.disabled=state.busy||uploading;c.onchange=()=>{c.checked?selected.add(f.id):selected.delete(f.id);settings()};row.append(c,document.createTextNode(f.name+' · '+f.format.toUpperCase()));box.append(row)}settings()}
function language(){document.documentElement.lang=$('lang').value;localStorage.setItem('converter-language',$('lang').value);document.querySelectorAll('[data-t]').forEach(n=>n.textContent=t(n.dataset.t));$('subtitle').textContent=t('local');render()}
$('lang').value=localStorage.getItem('converter-language')==='ku'?'ku':'tr';$('lang').onchange=language;$('mode').onchange=controls;$('action').onchange=()=>{if($('action').value==='rotate')$('factor').value='90';controls()};$('add').onclick=()=>$('picker').click();async function importFiles(input){uploading=true;let errors=[];try{for(let f of input.files){$('status').textContent=t('upload');try{let r=await api('upload',f,f);selected.add(r.id)}catch(e){errors.push(f.name+': '+e.message)}}}finally{uploading=false;input.value='';$('importerrors').textContent=errors.join(' · ');await refresh(true)}}$('picker').onchange=()=>importFiles($('picker'));$('addfolder').onclick=()=>$('folderpicker').click();$('folderpicker').onchange=()=>importFiles($('folderpicker'));$('clear').onclick=async()=>{try{await api('clear',{});selected.clear();await refresh(true)}catch(e){$('error').textContent=e.message}};$('remove').onclick=async()=>{try{for(let id of selected)await api('remove',{id});selected.clear();await refresh(true)}catch(e){$('error').textContent=e.message}};$('cancel').onclick=()=>api('cancel',{});
$('run').onclick=async()=>{try{let act=$('mode').value==='convert'?'convert':$('action').value;let ids=chosen().map(f=>f.id);await api('run',{ids,action:act,target:$('target').value,quality:$('quality').value,only_text:$('text').checked,ocr:$('ocr').checked,ocr_language:$('ocrlang').value,start:$('start').value,end:$('end').value,part:$('part').value,pages:$('pages').value,page_count:'1',factor:$('factor').value,audio_id:$('audio').value,audio_start:$('audiostart').value,audio_end:$('audioend').value,speech_format:$('speechformat').value.toLowerCase(),speech_language:$('speechlang').value});await refresh()}catch(e){$('error').textContent=e.message}};
async function refresh(force=false){try{state=await api('state');let key=state.files.map(f=>f.id).join()+':'+state.busy;if(force||key!==finger){finger=key;render()}$('progress').value=state.progress;$('status').textContent=t(uploading?'upload':state.status);$('error').textContent=['subtitle_line_count','subtitle_invalid'].find(k=>state.error.startsWith(k))?t(state.error.split(':')[0]):state.error;if(state.issues?.length)$('error').textContent+=($('lang').value==='tr'?'Atlanan / hatalı dosyalar: ':'Pelên derbaskirî / çewt: ')+state.issues.map(x=>x.name+' — '+(words[$('lang').value][x.error.split(':')[0]]||x.error)).join(' · ');let missing=Object.entries(state.tools).filter(([k,v])=>!v).map(([k])=>k);$('tools').textContent=missing.length?t('missing')+missing.join(', '):'✓ FFmpeg · LibreOffice · Pandoc · OCR';if(!state.speech)$('tools').textContent+='\n'+( $('lang').value==='tr'?'Konuşma motoru/modeli eksik.':'Motora axaftinê/model kêm e.');let box=$('result');box.hidden=!state.results.length;box.replaceChildren(...state.results.map(f=>{let a=document.createElement('a');a.href='download?id='+encodeURIComponent(f.id);a.textContent=f.name;return a}));for(let id of ['add','addfolder','remove','clear','mode','action','target','quality','text','ocr','ocrlang','start','end','part','pages','factor','audio','audiostart','audioend','speechlang','speechformat'])$(id).disabled=state.busy||uploading;controls()}catch(e){$('status').textContent=e.message}}
language();if(location.protocol==='file:'){$('status').textContent=$('lang').value==='tr'?'Dönüştürmek için paketteki baslat.sh dosyasını çalıştır; tarayıcı yerel motorla açılacak.':'Ji bo veguherandinê baslat.sh bixebitîne; gerok bi motora herêmî vedibe.'}else{refresh();setInterval(refresh,1000)}
